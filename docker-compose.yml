services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      # LLM answers are cached here so re-runs and re-uploads cost no quota
      - ./backend/.cache:/app/.cache
    env_file:
      - path: .env
        required: false
    environment:
      URGENT_SLA_BUSINESS_HOURS: ${URGENT_SLA_BUSINESS_HOURS:-2}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
